<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regulasi ISPO — SI-ISPO</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/public-shell.css">
<style>
  .filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 22px}
  .chip{padding:7px 14px;border:1px solid var(--bd);border-radius:999px;font-size:12.5px;color:var(--t2);background:#fff;cursor:pointer;transition:all .15s;font-family:inherit}
  .chip:hover{border-color:var(--g);color:var(--g)}
  .chip.on{background:var(--g);color:#fff;border-color:var(--g)}
  .search-inp{flex:1;min-width:240px;max-width:360px;padding:9px 14px;border:1px solid var(--bd);border-radius:9px;font-size:13.5px;font-family:inherit;outline:none;background:#fff}
  .search-inp:focus{border-color:var(--g)}

  .reg-list{display:flex;flex-direction:column;gap:14px}
  .reg-item{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;transition:all .15s;box-shadow:var(--shadow)}
  .reg-item:hover{border-color:var(--gm);box-shadow:var(--shadow-lg)}
  .reg-year{background:var(--gl);color:var(--g);font-weight:800;font-size:20px;padding:12px 14px;border-radius:10px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .reg-year small{display:block;font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;font-weight:600}
  .reg-body b{display:block;font-size:14.5px;font-weight:700;color:var(--t1);letter-spacing:-.15px;margin-bottom:4px}
  .reg-body .reg-num{font-size:11.5px;color:var(--g);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .reg-body p{font-size:13px;color:var(--t2);line-height:1.5}
  .reg-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .reg-actions .badge{background:var(--gs);color:var(--g);padding:3px 10px;border-radius:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .empty{padding:60px 20px;text-align:center;color:var(--t3)}
  @media (max-width:800px){.reg-item{grid-template-columns:1fr;text-align:left}.reg-actions{flex-direction:row;align-items:center}}
</style>
</head>
<body>

<div id="nav-slot"></div>

<div class="wrap">
  <section class="page-hero">
    <div class="crumb"><a href="/">Beranda</a><span class="sep">›</span><span>Regulasi</span></div>
    <h1 class="page-title">Regulasi &amp; Kebijakan ISPO</h1>
    <p class="page-sub">Kumpulan dasar hukum, peraturan pemerintah, dan standar internasional yang mengatur sertifikasi kelapa sawit berkelanjutan Indonesia.</p>
  </section>

  <div class="filter-row">
    <input class="search-inp" id="q" placeholder="Cari nomor, judul, atau kata kunci regulasi…" data-testid="reg-search">
    <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>

  <div class="reg-list" id="list"></div>
</div>

<div id="footer-slot"></div>

<script src="/public-shell.js"></script>
<script>
mountPublicShell('regulasi');

const list = document.getElementById('list');
const chips = document.getElementById('chips');
const qInp = document.getElementById('q');
let all = [], activeJenis = 'Semua', q = '';

function renderChips(kinds){
  chips.innerHTML = ['Semua', ...kinds].map(c =>
    `<button class="chip ${c===activeJenis?'on':''}" data-cat="${c}" data-testid="chip-${c}">${c}</button>`
  ).join('');
  chips.querySelectorAll('.chip').forEach(b => b.onclick = ()=>{
    activeJenis = b.dataset.cat; renderChips(kinds); render();
  });
}
function render(){
  const rows = all.filter(r => (activeJenis==='Semua' || r.jenis===activeJenis)
    && (!q || (r.nomor+' '+r.judul+' '+r.ringkasan).toLowerCase().includes(q.toLowerCase())));
  if (!rows.length){ list.innerHTML = '<div class="empty">Regulasi tidak ditemukan.</div>'; return; }
  list.innerHTML = rows.map(r => `
    <div class="reg-item" data-testid="reg-${r.id}">
      <div class="reg-year">${r.tahun}<small>Tahun</small></div>
      <div class="reg-body">
        <div class="reg-num">${r.nomor}</div>
        <b>${r.judul}</b>
        <p>${r.ringkasan}</p>
      </div>
      <div class="reg-actions">
        <span class="badge">${r.jenis}</span>
        <a class="btn btn-out" href="${r.file}" style="padding:7px 14px;font-size:12.5px" data-testid="download-${r.id}">📄 Unduh</a>
      </div>
    </div>`).join('');
}
qInp.oninput = () => { q = qInp.value; render(); };

(async ()=>{
  try{
    const r = await fetch('/api/regulasi');
    all = await r.json();
    const kinds = [...new Set(all.map(x=>x.jenis))];
    renderChips(kinds); render();
  } catch(e){ list.innerHTML = '<div class="empty">Gagal memuat regulasi.</div>'; }
})();
</script>
</body>
</html>
